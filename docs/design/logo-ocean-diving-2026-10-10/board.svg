<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"><rect width="1200" height="900" fill="#F7F5F0"/><style>text{font-family:Apple SD Gothic Neo,Arial,sans-serif;fill:#263A3E}.muted{fill:#68787A}</style><text x="64" y="59" font-size="18" letter-spacing="2">NAEIL / ABOVE &amp; BELOW</text><text x="64" y="111" font-size="30">바다 위의 내일, 물속에서 느끼는 고요함</text><text x="64" y="148" class="muted" font-size="17">마음에 드신 A · B에 다이빙의 경험을 넣어 본 후속 러프</text><rect x="64" y="196" width="520" height="630" fill="white"/><text x="92" y="239" class="muted" font-size="18">A1</text><svg x="169" y="266" width="310" height="310" viewBox="0 0 256 256"><g fill="#DE9857"><path d="M88 126A57 57 0 1 1 201 116C181 132 164 135 144 127C120 117 107 116 88 126Z"/></g><g fill="#244B51"><path d="M27 157C61 157 67 132 99 132C122 132 133 148 156 148C180 148 198 136 226 137C207 151 196 178 160 179C131 180 118 163 96 163C67 163 54 177 27 157Z"/></g><g fill="#244B51"><circle cx="118" cy="198" r="9"/><circle cx="105" cy="225" r="5.5"/></g></svg><text x="92" y="630" font-size="25">올라오는 숨, 떠오르는 해</text><text x="92" y="671" font-size="17" class="muted">A의 수면 아래 두 기포를 더함</text><text x="92" y="700" font-size="17" class="muted">수중의 숨과 수면 위의 해가 함께 올라감</text><svg x="88" y="734" width="72" height="72" viewBox="0 0 256 256"><g fill="#222222"><path d="M88 126A57 57 0 1 1 201 116C181 132 164 135 144 127C120 117 107 116 88 126Z"/></g><g fill="#222222"><path d="M27 157C61 157 67 132 99 132C122 132 133 148 156 148C180 148 198 136 226 137C207 151 196 178 160 179C131 180 118 163 96 163C67 163 54 177 27 157Z"/></g><g fill="#222222"><circle cx="118" cy="198" r="9"/><circle cx="105" cy="225" r="5.5"/></g></svg><text x="182" y="782" class="muted" font-size="14">다이빙의 느낌을 알아보기 쉽게 넣었는지 비교</text><rect x="614" y="196" width="520" height="630" fill="white"/><text x="642" y="239" class="muted" font-size="18">B1</text><svg x="719" y="266" width="310" height="310" viewBox="0 0 256 256"><g fill="#DE9857"><path d="M84 119A48 48 0 1 1 173 119Z"/></g><g fill="#244B51"><path d="M111 137C116 135 121 134 126 134L124 150C117 150 110 149 104 147Z"/><path d="M136 134C144 135 151 139 155 144C151 147 145 149 139 150Z"/><path d="M85 166C97 159 110 158 122 160L116 176C105 174 95 174 85 177Z"/><path d="M142 162C156 164 166 162 177 158C175 169 162 177 148 178Z"/><path d="M53 204C72 191 89 187 111 189L101 205C84 202 69 201 53 204Z"/><path d="M151 194C170 196 190 191 207 182C198 202 179 212 161 215Z"/></g></svg><text x="642" y="630" font-size="25">물속까지 닿는 아침빛</text><text x="642" y="671" font-size="17" class="muted">B의 잔물결 사이에 빛의 틈을 냄</text><text x="642" y="700" font-size="17" class="muted">해 아래의 빈 공간이 깊어질수록 넓어짐</text><svg x="638" y="734" width="72" height="72" viewBox="0 0 256 256"><g fill="#222222"><path d="M84 119A48 48 0 1 1 173 119Z"/></g><g fill="#222222"><path d="M111 137C116 135 121 134 126 134L124 150C117 150 110 149 104 147Z"/><path d="M136 134C144 135 151 139 155 144C151 147 145 149 139 150Z"/><path d="M85 166C97 159 110 158 122 160L116 176C105 174 95 174 85 177Z"/><path d="M142 162C156 164 166 162 177 158C175 169 162 177 148 178Z"/><path d="M53 204C72 191 89 187 111 189L101 205C84 202 69 201 53 204Z"/><path d="M151 194C170 196 190 191 207 182C198 202 179 212 161 215Z"/></g></svg><text x="732" y="782" class="muted" font-size="14">다이빙의 느낌을 알아보기 쉽게 넣었는지 비교</text><text x="64" y="869" class="muted" font-size="14">기존 A · B 유지 가능 · 다이빙 요소의 적합성을 시험하는 단계 · 최종안 아님</text></svg>