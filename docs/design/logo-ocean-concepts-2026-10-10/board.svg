<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F7F5F0"/><style>text{font-family:Apple SD Gothic Neo,Arial,sans-serif;fill:#24373B}.sub{fill:#69777A}</style><text x="64" y="63" font-size="18" letter-spacing="2">NAEIL / OCEAN MORNING</text><text x="64" y="113" font-size="32">바다에서 해가 떠오른다는 장면</text><text x="64" y="151" class="sub" font-size="17">글자나 기존 프레임 없이, 장면이 다른 세 가지 심벌 탐색</text><rect x="64" y="205" width="420" height="598" fill="white"/><text x="90" y="249" class="sub" font-size="18">A</text><svg x="139" y="279" width="270" height="270" viewBox="0 0 256 256"><g fill="#DE9857"><path d="M88 126A57 57 0 1 1 201 116C181 132 164 135 144 127C120 117 107 116 88 126Z"/></g><g fill="#244B51"><path d="M27 157C61 157 67 132 99 132C122 132 133 148 156 148C180 148 198 136 226 137C207 151 196 178 160 179C131 180 118 163 96 163C67 163 54 177 27 157Z"/></g></svg><text x="92" y="594" font-size="24">물결을 뚫고</text><text x="92" y="633" class="sub" font-size="17">해의 아랫면을 물결이 가르는 장면</text><text x="92" y="661" class="sub" font-size="17">수평선 대신, 물과 해의 경계가 기억점</text><svg x="92" y="695" width="84" height="84" viewBox="0 0 256 256"><g fill="#242424"><path d="M88 126A57 57 0 1 1 201 116C181 132 164 135 144 127C120 117 107 116 88 126Z"/></g><g fill="#242424"><path d="M27 157C61 157 67 132 99 132C122 132 133 148 156 148C180 148 198 136 226 137C207 151 196 178 160 179C131 180 118 163 96 163C67 163 54 177 27 157Z"/></g></svg><text x="204" y="746" class="sub" font-size="15">단색에서도 장면이 남는지 비교</text><rect x="510" y="205" width="420" height="598" fill="white"/><text x="536" y="249" class="sub" font-size="18">B</text><svg x="585" y="279" width="270" height="270" viewBox="0 0 256 256"><g fill="#DE9857"><path d="M84 119A48 48 0 1 1 173 119Z"/></g><g fill="#244B51"><path d="M111 137C128 131 147 134 155 144C143 151 122 153 104 147Z"/><path d="M85 166C105 155 125 160 143 162C156 164 166 162 177 158C175 171 158 180 139 178C118 175 102 173 85 177Z"/><path d="M53 204C84 182 110 187 137 192C161 197 184 193 207 182C197 204 168 219 137 215C104 211 78 201 53 204Z"/></g></svg><text x="538" y="594" font-size="24">빛이 먼저 닿는 바다</text><text x="538" y="633" class="sub" font-size="17">떠오른 해가 수면에 빛으로 이어짐</text><text x="538" y="661" class="sub" font-size="17">잔물결의 리듬으로 바다의 깊이를 표현</text><svg x="538" y="695" width="84" height="84" viewBox="0 0 256 256"><g fill="#242424"><path d="M84 119A48 48 0 1 1 173 119Z"/></g><g fill="#242424"><path d="M111 137C128 131 147 134 155 144C143 151 122 153 104 147Z"/><path d="M85 166C105 155 125 160 143 162C156 164 166 162 177 158C175 171 158 180 139 178C118 175 102 173 85 177Z"/><path d="M53 204C84 182 110 187 137 192C161 197 184 193 207 182C197 204 168 219 137 215C104 211 78 201 53 204Z"/></g></svg><text x="650" y="746" class="sub" font-size="15">단색에서도 장면이 남는지 비교</text><rect x="956" y="205" width="420" height="598" fill="white"/><text x="982" y="249" class="sub" font-size="18">C</text><svg x="1031" y="279" width="270" height="270" viewBox="0 0 256 256"><g fill="#244B51"><path d="M211 104C190 73 156 65 126 77C97 89 80 118 84 147C103 138 122 145 140 157C168 176 194 172 219 151C211 185 184 215 146 222C97 232 48 202 38 155C27 105 54 57 103 43C149 29 196 55 211 104Z"/></g><g fill="#DE9857"><circle cx="151" cy="115" r="28"/></g></svg><text x="984" y="594" font-size="24">해를 놓아주는 파도</text><text x="984" y="633" class="sub" font-size="17">파도가 둥글게 해를 감싸다가 열림</text><text x="984" y="661" class="sub" font-size="17">따뜻한 품과 다시 나오는 움직임을 결합</text><svg x="984" y="695" width="84" height="84" viewBox="0 0 256 256"><g fill="#242424"><path d="M211 104C190 73 156 65 126 77C97 89 80 118 84 147C103 138 122 145 140 157C168 176 194 172 219 151C211 185 184 215 146 222C97 232 48 202 38 155C27 105 54 57 103 43C149 29 196 55 211 104Z"/></g><g fill="#242424"><circle cx="151" cy="115" r="28"/></g></svg><text x="1096" y="746" class="sub" font-size="15">단색에서도 장면이 남는지 비교</text><text x="64" y="855" class="sub" font-size="15">방향 탐색용 러프 · 색은 감정 비교용 임시 제안 · 실제 로고 교체 없음</text></svg>