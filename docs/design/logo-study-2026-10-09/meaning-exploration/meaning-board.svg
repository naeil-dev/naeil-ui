<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000">
<rect width="1560" height="1000" fill="#fffaf4"/>
<g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<text x="64" y="45" font-size="18" fill="#806954" font-weight="400">naeil · 내일 / 의미 탐색</text>
<text x="64" y="104" font-size="34" fill="#4b3b32" font-weight="600">내일은 다시 시작할 수 있는 따뜻한 여지</text>
<text x="64" y="146" font-size="18" fill="#806954" font-weight="400">ㄴ + 해를 출발점으로, 로고의 완성도보다 담고 싶은 장면과 감정을 비교합니다.</text>
<path d="M64 176H1496" stroke="#e6d9cb"/>
<text x="64" y="220" font-size="24" fill="#4b3b32" font-weight="600">A · 다시 뜨는 해</text>
<text x="64" y="254" font-size="18" fill="#806954" font-weight="400">다시 시작할 수 있는 내일</text>
<g transform="translate(64 275)">
      <rect width="432" height="190" fill="#f8ebd8"/>
      <path d="M0 135H432V190H0Z" fill="#eee0ce"/>
      <path d="M165 135A55 55 0 0 1 275 135Z" fill="#de9148"/>
      <path d="M24 135H407" stroke="#ab8f75" stroke-width="2" fill="none"/>
      <path d="M44 149H107M308 162H374" stroke="#d3b997" stroke-width="2" fill="none"/>
    </g>
<text x="64" y="505" font-size="17" fill="#4b3b32" font-weight="400">어제와 상관없이, 새로운 하루가 옵니다.</text>
<text x="64" y="535" font-size="16" fill="#806954" font-weight="400">다시 시작 · 희망 · 고요함</text>
<text x="64" y="588" font-size="14" fill="#806954" font-weight="400">의미를 옮겨보는 러프 스케치</text>
<g transform="translate(92 610) scale(1.9)"><path d="M29 48A11 11 0 0 1 51 48Z" fill="#de9148"/><path d="M13 12V43Q13 48 18 48H57" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="84" y="777" font-size="15" fill="#806954" font-weight="400">지평선에서 시작하는 해</text>
<g transform="translate(308 610) scale(1.9)"><circle cx="41" cy="31" r="11" fill="#de9148"/><path d="M13 12V43Q13 48 18 48H57" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="300" y="777" font-size="15" fill="#806954" font-weight="400">조금 더 떠오른 해</text>
<text x="64" y="827" font-size="15" fill="#4b3b32" font-weight="400">확인할 것: 일출의 시작으로 느껴지는가?</text>
<path d="M524 218L524 864" stroke="#e6d9cb"/>
<text x="552" y="220" font-size="24" fill="#4b3b32" font-weight="600">B · 빛을 맞는 자리</text>
<text x="552" y="254" font-size="18" fill="#806954" font-weight="400">나를 반겨주는 내일</text>
<g transform="translate(552 275)">
      <rect width="432" height="190" fill="#f7eddf"/>
      <path d="M85 16V133Q85 159 112 159H397" stroke="#ad9278" stroke-width="3" fill="none"/>
      <path d="M375 40L150 156H251L396 61Z" fill="#efd2a7"/>
      <circle cx="341" cy="67" r="34" fill="#de9148"/>
      <path d="M116 169H389" stroke="#dfc5a5" fill="none"/>
    </g>
<text x="552" y="505" font-size="17" fill="#4b3b32" font-weight="400">열린 자리에 햇빛과 여유가 들어옵니다.</text>
<text x="552" y="535" font-size="16" fill="#806954" font-weight="400">따뜻함 · 환대 · 편안함</text>
<text x="552" y="588" font-size="14" fill="#806954" font-weight="400">의미를 옮겨보는 러프 스케치</text>
<g transform="translate(580 610) scale(1.9)"><circle cx="40" cy="34" r="10" fill="#de9148"/><path d="M12 15V35Q12 51 28 51H58" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="572" y="777" font-size="15" fill="#806954" font-weight="400">해를 받아들이는 ㄴ</text>
<g transform="translate(796 610) scale(1.9)"><circle cx="45" cy="24" r="10" fill="#de9148"/><path d="M34 40L28 46" fill="none" stroke="#de9148" stroke-width="3" stroke-linecap="round"/><path d="M12 14V37Q12 51 26 51H56" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="788" y="777" font-size="15" fill="#806954" font-weight="400">빈 자리로 들어오는 빛</text>
<text x="552" y="827" font-size="15" fill="#4b3b32" font-weight="400">확인할 것: 따뜻함이 ㄴ에서도 느껴지는가?</text>
<path d="M1012 218L1012 864" stroke="#e6d9cb"/>
<text x="1040" y="220" font-size="24" fill="#4b3b32" font-weight="600">C · 새 아침으로</text>
<text x="1040" y="254" font-size="18" fill="#806954" font-weight="400">한 걸음부터 시작하는 내일</text>
<g transform="translate(1040 275)">
      <rect width="432" height="190" fill="#f8ebd8"/>
      <path d="M0 146H121C207 146 199 113 276 113H432V190H0Z" fill="#e7d3b9"/>
      <path d="M13 146H121C207 146 199 113 276 113H417" stroke="#ad9278" stroke-width="3" fill="none"/>
      <path d="M282 113A42 42 0 0 1 366 113Z" fill="#de9148"/>
    </g>
<text x="1040" y="505" font-size="17" fill="#4b3b32" font-weight="400">작은 시작이 다음 아침으로 이어집니다.</text>
<text x="1040" y="535" font-size="16" fill="#806954" font-weight="400">새출발 · 작은 변화 · 기대</text>
<text x="1040" y="588" font-size="14" fill="#806954" font-weight="400">의미를 옮겨보는 러프 스케치</text>
<g transform="translate(1068 610) scale(1.9)"><circle cx="47" cy="26" r="10" fill="#de9148"/><path d="M12 13V49H32V42H58" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1060" y="777" font-size="15" fill="#806954" font-weight="400">작은 한 칸과 해</text>
<g transform="translate(1284 610) scale(1.9)"><path d="M38 39A11 11 0 0 1 60 39Z" fill="#de9148"/><path d="M12 13V44Q12 49 18 49H28C37 49 38 39 48 39H60" fill="none" stroke="#4b3b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1276" y="777" font-size="15" fill="#806954" font-weight="400">아침으로 이어지는 선</text>
<text x="1040" y="827" font-size="15" fill="#4b3b32" font-weight="400">확인할 것: 성과보다 시작으로 읽히는가?</text>
<path d="M64 891H1496" stroke="#e6d9cb"/>
<text x="64" y="925" font-size="18" fill="#4b3b32" font-weight="400">현재 가설: A의 ‘다시 뜨는 해’에 B의 ‘빛을 맞는 자리’가 주는 편안함을 더해보기.</text>
<text x="64" y="960" font-size="15" fill="#806954" font-weight="400">색과 선은 임시 표현입니다. 다음에는 마음에 가까운 장면 하나를 골라 ㄴ과 해의 관계를 다듬습니다.</text>
</g></svg>
