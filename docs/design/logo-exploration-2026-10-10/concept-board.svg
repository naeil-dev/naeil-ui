<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200" color="#242424" fill="#242424"><title>naeil — five meaning-first rough concepts</title><rect width="1500" height="1200" fill="#fafafa"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="56" y="60" font-size="34" font-weight="600" fill="#242424">naeil / 내일을 떠올리는 다섯 장면</text><text x="57" y="95" font-size="18" font-weight="400" fill="#666666">의미 탐색 01   ·   단색 러프 스케치   ·   색·워드마크·최종 형태 미정</text><path d="M56 125H1444" stroke="#cccccc"/><text x="56" y="178" font-size="23" font-weight="600" fill="#242424">A  /  이불을 걷는 순간</text><text x="56" y="213" font-size="17" font-weight="400" fill="#555555">충분히 쉰 뒤, 다시 바깥으로.</text><g transform="translate(169 246) scale(1.55)"><path d="M27 34C47 32 54 22 69 23C87 24 88 48 108 48C94 62 78 64 64 57C48 49 40 39 27 34L25 46C45 49 61 70 86 69C96 69 104 66 111 61L101 98Q98 109 86 108L24 101Q15 100 17 91L23 39Q24 34 27 34Z"/></g><text x="56" y="482" font-size="14" font-weight="600" fill="#666666">형태</text><text x="56" y="508" font-size="15" font-weight="400" fill="#242424">넓은 천과 들린 귀퉁이 · 쉬는 곳에서 열린 곳으로</text><text x="56" y="540" font-size="18" font-weight="600" fill="#242424">포근함, 부담 없는 시작</text><text x="56" y="572" font-size="15" font-weight="400" fill="#666666">파도·티슈·수건으로도 보임</text><text x="56" y="595" font-size="15" font-weight="400" fill="#666666">아침은 설명이 필요.</text><text x="528" y="178" font-size="23" font-weight="600" fill="#242424">B  /  매듭 뒤에도 이어지는 실</text><text x="528" y="213" font-size="17" font-weight="400" fill="#555555">어제를 풀어 없애지 않아도, 이어 갈 수 있다.</text><g transform="translate(641 246) scale(1.55)"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M20 94C44 101 63 76 64 49C65 24 44 22 41 43C40 51 45 59 51 64"/><path d="M64 72C80 80 95 76 99 63C105 46 88 34 96 18"/></g></g><text x="528" y="482" font-size="14" font-weight="600" fill="#666666">형태</text><text x="528" y="508" font-size="15" font-weight="400" fill="#242424">느슨한 고리 하나와 위로 빠져나가는 긴 끝</text><text x="528" y="540" font-size="18" font-weight="600" fill="#242424">회복, 다정함, 조용한 의지</text><text x="528" y="572" font-size="15" font-weight="400" fill="#666666">실보다 리본·필기체로 읽힐 수 있음</text><text x="528" y="595" font-size="15" font-weight="400" fill="#666666">얽힘의 인상도 있음.</text><text x="1000" y="178" font-size="23" font-weight="600" fill="#242424">C  /  넘긴 장, 남아 있는 장</text><text x="1000" y="213" font-size="17" font-weight="400" fill="#555555">지금까지의 나를 품고, 다음 이야기를 연다.</text><g transform="translate(1113 246) scale(1.55)"><path d="M19 57L59 73V99L19 84V75L49 86V80L19 68Z"/><path d="M68 73L108 57V68L78 80V86L108 75V84L68 99Z"/><path d="M64 62L79 22Q81 18 85 20L108 30Q112 32 110 37L96 56L73 66Q63 70 56 66L24 54V46L56 58Q62 61 64 62Z"/></g><text x="1000" y="482" font-size="14" font-weight="600" fill="#666666">형태</text><text x="1000" y="508" font-size="15" font-weight="400" fill="#242424">아래에 남은 한 장 + 위로 돌아가는 한 장</text><text x="1000" y="540" font-size="18" font-weight="600" fill="#242424">기대, 여유, 지워지지 않는 연속성</text><text x="1000" y="572" font-size="15" font-weight="400" fill="#666666">책·문서 서비스에 가까움</text><text x="1000" y="595" font-size="15" font-weight="400" fill="#666666">위쪽 장은 깃발로도 보일 수 있음.</text><text x="56" y="678" font-size="23" font-weight="600" fill="#242424">D  /  혼자 뛰지 않아도 되는 내일</text><text x="56" y="713" font-size="17" font-weight="400" fill="#555555">작은 발판들이 서로의 다음 걸음을 만든다.</text><g transform="translate(169 746) scale(1.55)"><path d="M15 89C14 78 24 70 39 70C49 70 53 75 51 84C49 96 32 102 22 98Q15 96 15 89Z"/><path d="M48 59C43 50 50 42 62 41C74 39 85 43 84 52C83 61 69 67 60 66Q51 65 48 59Z"/><path d="M83 30C83 20 94 17 104 20C115 23 118 33 111 40C103 47 85 42 83 30Z"/></g><text x="56" y="982" font-size="14" font-weight="600" fill="#666666">형태</text><text x="56" y="1008" font-size="15" font-weight="400" fill="#242424">크기가 다른 낮은 돌 셋이 짧은 간격으로 이어짐</text><text x="56" y="1040" font-size="18" font-weight="600" fill="#242424">동행, 차근차근, 안전하게 건너감</text><text x="56" y="1072" font-size="15" font-weight="400" fill="#666666">발자국·조약돌 장식으로도 보임</text><text x="56" y="1095" font-size="15" font-weight="400" fill="#666666">관계의 의미는 설명 의존.</text><text x="528" y="678" font-size="23" font-weight="600" fill="#242424">E  /  내일도 남겨 둔 자리</text><text x="528" y="713" font-size="17" font-weight="400" fill="#555555">다시 돌아와도, 나를 위한 자리가 있다.</text><g transform="translate(641 746) scale(1.55)"><path d="M24 62L21 39Q20 27 31 25L40 24Q51 24 53 35L57 62Z"/><path d="M65 62L70 33Q72 22 83 24L92 26Q103 29 100 40L95 62Z"/><path d="M19 71H108V79Q108 85 101 85H95L91 105H80L82 85H44L46 105H35L31 85H26Q19 85 19 78Z"/></g><text x="528" y="982" font-size="14" font-weight="600" fill="#666666">형태</text><text x="528" y="1008" font-size="15" font-weight="400" fill="#242424">서로 기댄 두 등받이와 하나로 이어진 긴 좌석</text><text x="528" y="1040" font-size="18" font-weight="600" fill="#242424">환대, 안도감, 함께 있음</text><text x="528" y="1072" font-size="15" font-weight="400" fill="#666666">가구·공간 브랜드로 읽히기 쉬움</text><text x="528" y="1095" font-size="15" font-weight="400" fill="#666666">내일이라는 시간은 간접적.</text><text x="1000" y="678" font-size="23" font-weight="600" fill="#242424">먼저 더 보고 싶은 방향</text><text x="1000" y="730" font-size="21" font-weight="600" fill="#242424">B  /  회복의 이야기를 가장 고유하게</text><text x="1000" y="762" font-size="17" font-weight="400" fill="#242424">매듭을 남긴 채 이어지는 끝이 핵심입니다.</text><text x="1000" y="788" font-size="17" font-weight="400" fill="#242424">다만 리본처럼 보이는 약점은 더 풀어야 합니다.</text><text x="1000" y="856" font-size="21" font-weight="600" fill="#242424">A  /  따뜻함을 생활의 장면으로</text><text x="1000" y="888" font-size="17" font-weight="400" fill="#242424">내일을 쉼 이후의 작은 움직임으로 봅니다.</text><text x="1000" y="914" font-size="17" font-weight="400" fill="#242424">천과 파도의 경계를 더 탐색할 가치가 있습니다.</text><text x="1000" y="982" font-size="17" font-weight="600" fill="#242424">선정이 아니라, 다음 탐색에 대한 제안입니다.</text><text x="1000" y="1015" font-size="17" font-weight="400" fill="#242424">느껴지는 장면과 감정부터 비교해 주세요.</text><text x="1000" y="1070" font-size="15" font-weight="400" fill="#666666">글자는 설명용 시스템 서체입니다.</text><text x="1000" y="1093" font-size="15" font-weight="400" fill="#666666">제품 로고·UI·토큰은 변경하지 않았습니다.</text><path d="M56 1145H1444" stroke="#cccccc"/><text x="56" y="1176" font-size="15" font-weight="400" fill="#666666">2026.10.10  /  각 안은 서로 다른 발상 하나. 형태 해석은 제작자의 관찰이며 사용자 조사 결과가 아닙니다.</text></g></svg>