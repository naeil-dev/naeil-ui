name: Verify UI package and examples

on:
  pull_request:
  push:
    branches: [main, feat/public-ui-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package-and-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Keep both images aligned with the lockfile; the preflight checks the version.
    # Browsers and OS dependencies are baked in, avoiding runner apt mirror stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen component regressions archive immutable release source commits.
          fetch-depth: 0
      # Actions mounts these directories as uid 1001; this image runs as root.
      # Firefox checks HOME ownership and Git checks repository ownership.
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rollout regression tests launch Chromium; package checks also use WebKit.
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium webkit
      - run: pnpm test
      - run: pnpm test:rollout
      - run: python3 -B scripts/rollout/jev-native.test.py
      - run: node --test scripts/account-render.test.mjs
      - run: node --test scripts/site-auth-slot.test.mjs
      - run: node scripts/build-ui-release.mjs --check
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm build:tokens
      - run: git diff --exit-code -- src/styles/theme.css
      - run: pnpm check:contrast
      - run: pnpm build:pkg
      - run: pnpm check:package
      - run: node --test scripts/consumer-font-notices.test.mjs
      - name: Separate website compatibility build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-build-fixture

  storybook-and-browser:
    # Split the slow paired file separately; equal test counts are not equal work.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [other, pairs-1, pairs-2, pairs-3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Actual projects: Chromium, Firefox, WebKit; artifact upload does not deploy.
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium firefox webkit
      - run: pnpm build:storybook
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium' && matrix.suite == 'other'
        with:
          name: storybook-preview
          path: storybook-static/
          retention-days: 14
          if-no-files-found: error
      - name: Run browser coverage
        env:
          NAEIL_UI_TEST_BROWSER: ${{ matrix.browser }}
          NAEIL_UI_TEST_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$NAEIL_UI_TEST_SUITE" = other ]; then
            printf '%s\n' chrome-pairs.spec.ts > "$RUNNER_TEMP/paired-tests.txt"
            pnpm test:browser --project="$NAEIL_UI_TEST_BROWSER" --test-list-invert "$RUNNER_TEMP/paired-tests.txt"
          else
            pnpm test:browser e2e/chrome-pairs.spec.ts --project="$NAEIL_UI_TEST_BROWSER" --fully-parallel --shard="${NAEIL_UI_TEST_SUITE#pairs-}/3"
          fi
      - name: Optional reference-workflow regressions (no credentials)
        if: matrix.browser == 'chromium' && matrix.suite == 'other'
        run: |
          node --test skills/frontend-reference-workflow/tests/browser-check.test.cjs
          node --test skills/frontend-reference-workflow/tests/layout-comparison.test.cjs
          python3 -m unittest discover -s skills/frontend-reference-workflow/tests -p 'test_mcp_client.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
