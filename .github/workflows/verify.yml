name: Verify UI package and examples

on:
  pull_request:
  push:
    branches: [main, feat/public-ui-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package-and-site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Keep both images aligned with the lockfile; the preflight checks the version.
    # Browsers and OS dependencies are baked in, avoiding runner apt mirror stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Browser shared memory is still needed; retired orphan-worker tests are gone.
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Frozen component regressions archive immutable release source commits.
          fetch-depth: 0
      # Actions mounts these directories as uid 1001; this image runs as root.
      # Firefox checks HOME ownership and Git checks repository ownership.
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit deployed site runtime (including development dependencies)
        run: |
          node --test scripts/ci/audit-site-runtime.test.mjs scripts/ci/select-docs-verification.test.mjs
          node scripts/ci/audit-site-runtime.mjs
      # Package checks and painted-theme fixtures use all three engines.
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium firefox webkit
      - run: pnpm test
      - run: node --test scripts/build-chrome-fixtures.test.mjs
      - run: node --test scripts/account-render.test.mjs
      - run: node --test scripts/site-auth-slot.test.mjs
      - run: node --test scripts/site-account-language.test.mjs
      - run: node scripts/build-ui-release.mjs --check
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm build:tokens
      - run: git diff --exit-code -- src/styles/theme.css
      - run: pnpm check:contrast
      - run: pnpm build:pkg
      - run: pnpm check:package
      - name: Packed Next (both bundlers) and Vite theme paint regression
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/theme-pack.json"
          NAEIL_UI_PAINT_ARCHIVE="$RUNNER_TEMP/$(node -p 'require(process.env.RUNNER_TEMP + "/theme-pack.json")[0].filename')" pnpm test:theme-paint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: theme-paint-results
          path: test-results/theme-paint/
          if-no-files-found: ignore
      - run: node --test scripts/consumer-font-notices.test.mjs
      - name: Separate website compatibility build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon

      - name: Build and test compiled invitation boundary (synthetic local Auth/RPC)
        run: |
          pnpm exec next build --webpack
          NAEIL_INVITE_PRODUCTION_TEST=1 pnpm exec vitest run src/lib/auth/__tests__/invite-production.test.ts
        env:
          NAEIL_INVITE_DIST_DIR: .next-console-invite
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon

      - name: Pack the verified UI for built-site locale journeys
        run: pnpm pack --out "$RUNNER_TEMP/naeil-ui-locale.tgz"
      - name: Built-site locale journeys (sender off and on)
        run: node scripts/site-language-acceptance.mjs
        env:
          NAEIL_LANGUAGE_PACK: ${{ runner.temp }}/naeil-ui-locale.tgz
          NAEIL_ACCOUNT_EVIDENCE: ${{ github.workspace }}/test-results/site-language-acceptance
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: site-language-results
          path: ${{ github.workspace }}/test-results/site-language-acceptance/
          if-no-files-found: ignore

  storybook-and-browser:
    # Split the slow paired file separately; equal test counts are not equal work.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [other, pairs-1, pairs-2, pairs-3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Actual projects: Chromium, Firefox, WebKit; artifact upload does not deploy.
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium firefox webkit
      - run: pnpm build:storybook
      - name: Build package for runtime conformance specs
        if: matrix.suite == 'other'
        run: pnpm build:pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.browser == 'chromium' && matrix.suite == 'other'
        with:
          # Publication selects this only after the entire Verify run succeeds.
          name: storybook-preview
          path: storybook-static/
          retention-days: 14
          if-no-files-found: error
      - name: Run browser coverage
        env:
          NAEIL_UI_TEST_BROWSER: ${{ matrix.browser }}
          NAEIL_UI_TEST_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$NAEIL_UI_TEST_SUITE" = other ]; then
            printf '%s\n' chrome-pairs.spec.ts > "$RUNNER_TEMP/paired-tests.txt"
            pnpm test:browser --project="$NAEIL_UI_TEST_BROWSER" --test-list-invert "$RUNNER_TEMP/paired-tests.txt"
          else
            pnpm test:browser e2e/chrome-pairs.spec.ts --project="$NAEIL_UI_TEST_BROWSER" --fully-parallel --shard="${NAEIL_UI_TEST_SUITE#pairs-}/3"
          fi
      - name: Optional reference-workflow regressions (no credentials)
        if: matrix.browser == 'chromium' && matrix.suite == 'other'
        run: |
          node --test skills/frontend-reference-workflow/tests/browser-check.test.cjs
          node --test skills/frontend-reference-workflow/tests/layout-comparison.test.cjs
          python3 -m unittest discover -s skills/frontend-reference-workflow/tests -p 'test_mcp_client.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
