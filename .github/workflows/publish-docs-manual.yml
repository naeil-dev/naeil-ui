name: Publish reviewed UI docs (manual only)

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA whose docs and acceptance evidence were approved
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_REVIEWED_DOCS after explicit publication authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-ui-docs
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_REVIEWED_DOCS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Use the reviewed dispatch workflow's selector, not code from an artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the exact reviewed commit to belong to main
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse "$REVIEWED_SHA^{commit}")" = "$REVIEWED_SHA"
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require successful exact-SHA verification and its preview
        id: verified
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/select-docs-verification.mjs
      - name: Download the verified Storybook bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.verified.outputs.artifact_id }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: storybook-static
          merge-multiple: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
