name: Publish reviewed UI docs (manual only)

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA whose docs and acceptance evidence were approved
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_REVIEWED_DOCS after explicit publication authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-ui-docs
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_REVIEWED_DOCS'
    # Same browser split as verify.yml: one unsharded job exceeds the timeout.
    # deploy waits for every cell; only one cell uploads the Pages artifact.
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [other, pairs-1, pairs-2, pairs-3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Match verify.yml and the locked Playwright version; browsers and OS deps
    # are preinstalled so publication does not depend on runner apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.reviewed_sha }}
      # Firefox checks HOME ownership and Git checks repository ownership.
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - name: Require the exact reviewed commit
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Require the reviewed commit to belong to main
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium firefox webkit
      - run: pnpm build:storybook
      - name: Build package for runtime conformance specs
        if: matrix.suite == 'other'
        run: pnpm build:pkg
      - name: Run browser coverage
        env:
          NAEIL_UI_TEST_BROWSER: ${{ matrix.browser }}
          NAEIL_UI_TEST_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$NAEIL_UI_TEST_SUITE" = other ]; then
            printf '%s\n' chrome-pairs.spec.ts > "$RUNNER_TEMP/paired-tests.txt"
            pnpm test:browser --project="$NAEIL_UI_TEST_BROWSER" --test-list-invert "$RUNNER_TEMP/paired-tests.txt"
          else
            pnpm test:browser e2e/chrome-pairs.spec.ts --project="$NAEIL_UI_TEST_BROWSER" --fully-parallel --shard="${NAEIL_UI_TEST_SUITE#pairs-}/3"
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: matrix.browser == 'chromium' && matrix.suite == 'other'
        with:
          path: storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
