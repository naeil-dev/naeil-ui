name: Publish reviewed UI docs (manual only)

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA whose docs and acceptance evidence were approved
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_REVIEWED_DOCS after explicit publication authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-ui-docs
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_REVIEWED_DOCS'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Match verify.yml and the locked Playwright version; browsers and OS deps
    # are preinstalled so publication does not depend on runner apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
      # Firefox checks HOME ownership and Git checks repository ownership.
      - name: Match mounted directory ownership to the runner user
        run: chown "$(id -u):$(id -g)" "$HOME" "$GITHUB_WORKSPACE"
      - name: Require the exact reviewed commit
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify preinstalled Playwright browsers
        run: node scripts/ci/check-playwright-image.mjs chromium firefox webkit
      - run: pnpm build:storybook
      - run: pnpm test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
